name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint - Typecheck - Test - Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versi pnpm diambil dari field `packageManager` di package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @webcat/api exec prisma validate --schema prisma/schema

      # Paket kontrak (CommonJS) harus dibangun sebelum typecheck/build
      # karena web & API mengimpor tipe dari dist-nya.
      - name: Build contracts
        run: pnpm --filter @webcat/contracts build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build web memakai adapter-node (bukan adapter-vercel) di CI,
          # karena adapter-vercel memerlukan symlink yang tidak tersedia.
          VERCEL: ''

  contract-diff:
    name: Prisma migration drift
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ secrets.SHADOW_DATABASE_URL != '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrasi wajib ada untuk setiap perubahan schema
        run: |
          pnpm --filter @webcat/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema \
            --shadow-database-url "${{ secrets.SHADOW_DATABASE_URL }}" \
            --exit-code \
            || (echo "::error::Schema berubah tanpa migrasi baru" && exit 1)
