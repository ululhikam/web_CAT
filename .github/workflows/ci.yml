name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint - Typecheck - Test - Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Nilai dummy: `prisma validate`/`generate` hanya membaca schema dan tidak
    # menyentuh database. DIRECT_URL wajib ada karena dideklarasikan di
    # blok datasource.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/webcat
      DIRECT_URL: postgresql://user:pass@localhost:5432/webcat

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versi pnpm diambil dari field `packageManager` di package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @webcat/api exec prisma validate --schema prisma/schema

      - name: Prisma generate
        run: pnpm db:generate

      # Paket kontrak (CommonJS) harus dibangun sebelum typecheck/build
      # karena web & API mengimpor tipe dari dist-nya.
      - name: Build contracts
        run: pnpm --filter @webcat/contracts build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build web memakai adapter-node (bukan adapter-vercel) di CI,
          # karena adapter-vercel memerlukan symlink yang tidak tersedia.
          VERCEL: ''

      # Gagal bila `docs/api/openapi.json` tidak lagi cocok dengan controller
      # dan skema Zod. Generator menyediakan placeholder env sendiri, jadi
      # tidak butuh database maupun secret asli.
      - name: OpenAPI sinkron dengan kode
        run: pnpm --filter @webcat/api docs:openapi:check

  # ---------------------------------------------------------------------------
  # Test integrasi terhadap PostgreSQL nyata (F2-09).
  #
  # Kenapa job terpisah: `verify` sengaja tidak menyentuh database, sedangkan
  # job ini membuat DB, menjalankan migrasi, lalu TRUNCATE tabel transaksional.
  #
  # Kenapa dua nama database: helper `test/integration/setup.ts` menolak
  # berjalan bila `DATABASE_URL_TEST` menunjuk database yang sama dengan
  # `DATABASE_URL`/`DIRECT_URL` (pengaman agar data demo tidak terhapus).
  # Jadi DATABASE_URL memakai nama lain (`webcat_ci`) yang tidak pernah
  # dihubungi; hanya step migrasi yang diarahkan ke DB uji.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: webcat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/webcat_ci
      DIRECT_URL: postgresql://postgres:test@localhost:5432/webcat_ci
      DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/webcat_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Build contracts
        run: pnpm --filter @webcat/contracts build

      - name: Migrasi ke database uji
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/webcat_test
          DIRECT_URL: postgresql://postgres:test@localhost:5432/webcat_test
        run: pnpm db:deploy

      - name: Test integrasi
        run: pnpm test:integration

  contract-diff:
    name: Prisma migration drift
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ secrets.SHADOW_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrasi wajib ada untuk setiap perubahan schema
        run: |
          pnpm --filter @webcat/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema \
            --shadow-database-url "${{ secrets.SHADOW_DATABASE_URL }}" \
            --exit-code \
            || (echo "::error::Schema berubah tanpa migrasi baru" && exit 1)
